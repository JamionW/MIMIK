# XcodeGen spec: `xcodegen generate` in ios/ writes Mimik.xcodeproj, which is not committed.
# Run scripts/bundle_ios.py first; it fills Generated/, which the targets bundle as folders.
name: Mimik
options:
  bundleIdPrefix: com.jamionw
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    # Set to your Apple Developer team id to sign for a device or TestFlight.
    DEVELOPMENT_TEAM: ""
packages:
  MimikCore:
    path: MimikCore
targets:
  Mimik:
    type: application
    platform: iOS
    sources:
      - path: Mimik
      - path: Shared
      - path: Generated/Phrases
        type: folder
        buildPhase: resources
      - path: Generated/Audio
        type: folder
        buildPhase: resources
    dependencies:
      - package: MimikCore
      - target: MimikWidget
    info:
      path: Mimik/Info.plist
      properties:
        CFBundleDisplayName: Mimik
        UILaunchScreen: {}
        # Keeps the lock-screen replay controls alive after the screen locks.
        UIBackgroundModes: [audio]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
        CFBundleURLTypes:
          - CFBundleURLName: com.jamionw.mimik
            CFBundleURLSchemes: [mimik]
    entitlements:
      path: Mimik/Mimik.entitlements
      properties:
        com.apple.security.application-groups: [group.com.jamionw.mimik]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jamionw.mimik
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
  MimikWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: MimikWidget
      - path: Shared
      - path: Generated/Phrases
        type: folder
        buildPhase: resources
    dependencies:
      - package: MimikCore
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    info:
      path: MimikWidget/Info.plist
      properties:
        CFBundleDisplayName: Mimik
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: MimikWidget/MimikWidget.entitlements
      properties:
        com.apple.security.application-groups: [group.com.jamionw.mimik]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jamionw.mimik.widget
        TARGETED_DEVICE_FAMILY: "1"
schemes:
  Mimik:
    build:
      targets:
        Mimik: all
