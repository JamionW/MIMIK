name: iOS

# Tests the shared logic on Linux, then builds the app for the simulator on macOS. The macOS job
# fetches clips from the deployed site rather than running edge-tts, so a phrase added in the same
# change builds without its audio and falls back to the device voice.
on:
  push:
    paths: ["ios/**", "site/*/phrases.json", "scripts/bundle_ios.py", "scripts/build.py", ".github/workflows/ios.yml"]
  pull_request:
    paths: ["ios/**", "site/*/phrases.json", "scripts/bundle_ios.py", "scripts/build.py", ".github/workflows/ios.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    runs-on: ubuntu-latest
    container: swift:6.1-noble
    steps:
      - uses: actions/checkout@v4
      - run: swift test --package-path ios/MimikCore

  app:
    needs: core
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Bundle phrases and clips
        run: python scripts/bundle_ios.py --fetch https://jamionw.github.io/MIMIK/
      - run: brew install xcodegen
      - name: Generate the Xcode project
        working-directory: ios
        run: xcodegen generate
      - name: Build for the simulator
        working-directory: ios
        # The full log is long; this shows Swift errors and warnings and the result.
        run: |
          set -o pipefail
          xcodebuild build -project Mimik.xcodeproj -scheme Mimik -configuration Debug \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath build CODE_SIGNING_ALLOWED=NO 2>&1 \
            | (grep -E "error:|warning: .*\.swift|BUILD (SUCCEEDED|FAILED)" || true)
      # Launches the app, opens Portuguese through the widget's link, and fails if it is not
      # still running a few seconds later. The screenshots are kept as the run's artifact.
      - name: Launch in the simulator
        working-directory: ios
        run: |
          udid=$(xcrun simctl list devices available | grep -m1 -E "^ +iPhone" | grep -oE "[0-9A-F-]{36}")
          xcrun simctl boot "$udid"
          xcrun simctl bootstatus "$udid"
          app=build/Build/Products/Debug-iphonesimulator/Mimik.app
          ls "$app/Phrases" "$app/Audio/pt/audio" | head -5
          mkdir -p shots
          xcrun simctl install "$udid" "$app"
          xcrun simctl launch "$udid" com.jamionw.mimik
          sleep 5
          xcrun simctl io "$udid" screenshot shots/1-picker.png
          xcrun simctl openurl "$udid" mimik://pt
          sleep 5
          xcrun simctl io "$udid" screenshot shots/2-portuguese.png
          xcrun simctl ui "$udid" appearance dark
          sleep 2
          xcrun simctl io "$udid" screenshot shots/3-portuguese-dark.png
          xcrun simctl spawn "$udid" launchctl list | grep -q com.jamionw.mimik || { echo "Mimik is not running"; exit 1; }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: simulator-screenshots
          path: ios/shots/
          if-no-files-found: ignore
