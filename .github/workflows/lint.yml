name: Lint

# Catches phrase mistakes on the pull request, before they reach the deploy on main.
on:
  pull_request:
    paths: ["site/*/phrases.json", "site/*/audio-human/**", "scripts/lint_phrases.py"]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/lint_phrases.py
