<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{{TITLE}}</title>
<meta name="description" content="Time-of-day {{NAME}} phrases with audio.">
<meta name="theme-color" content="#121212" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f6f3ee" media="(prefers-color-scheme: light)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="{{TITLE}}">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<style>
  :root {
    --bg: #f6f3ee;
    --card: #ffffff;
    --line: #e4dfd6;
    --text: #1a1a1a;
    --muted: #6b665e;
    --accent: #1f4e9c;
    --accent-ink: #ffffff;
    --tag: #e8eef8;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #121212;
      --card: #1c1c1c;
      --line: #2c2c2c;
      --text: #f2efe9;
      --muted: #9a958c;
      --accent: #7fa8e8;
      --accent-ink: #0f1a2c;
      --tag: #1f2a3c;
    }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 17px/1.35 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding: 0 16px calc(env(safe-area-inset-bottom) + 32px);
    -webkit-tap-highlight-color: transparent;
  }
  main { max-width: 640px; margin: 0 auto; }

  header {
    position: sticky; top: 0; z-index: 1;
    background: var(--bg);
    padding: calc(env(safe-area-inset-top) + 14px) 0 10px;
  }
  .clock { display: flex; justify-content: space-between; align-items: baseline; color: var(--muted); font-size: 15px; }
  .clock b { color: var(--text); font-size: 22px; font-variant-numeric: tabular-nums; font-weight: 600; }
  .who { display: flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .who button {
    border: 0; background: transparent; color: var(--muted);
    font: inherit; font-size: 14px; padding: 5px 12px; min-height: 32px;
  }
  .who button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
  .left { display: flex; align-items: center; gap: 12px; }
  .lang { color: var(--muted); font-size: 14px; text-decoration: none; padding: 6px 0; }
  .find { border: 0; background: none; color: var(--muted); width: 36px; height: 36px; padding: 8px; margin-left: -8px; }
  .find svg { width: 100%; height: 100%; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; }
  .search { display: flex; gap: 8px; margin-top: 10px; }
  .search[hidden], nav[hidden] { display: none; }
  .search input {
    flex: 1; min-width: 0; min-height: 40px; padding: 0 12px;
    border: 1px solid var(--line); border-radius: 10px;
    background: var(--card); color: var(--text); font: inherit; font-size: 17px;
  }
  .search input:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  .search button { border: 0; background: none; color: var(--accent); font: inherit; font-size: 15px; padding: 0 4px; }
  .empty { color: var(--muted); margin: 26px 0; }
  .offline { margin: 6px 0 0; color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }
  .offline.warn { color: var(--text); font-weight: 600; }
  nav { display: flex; gap: 6px; margin-top: 10px; }
  nav button {
    flex: 1; min-height: 40px;
    border: 1px solid var(--line); border-radius: 10px;
    background: transparent; color: var(--muted);
    font: inherit; font-size: 15px;
  }
  nav button.now { color: var(--text); }
  nav button.now::after { content: " \2022"; color: var(--accent); }
  nav button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  nav button[aria-pressed="true"]::after { color: var(--accent-ink); }

  h2 {
    margin: 26px 0 10px; font-size: 13px; font-weight: 600;
    letter-spacing: .08em; text-transform: uppercase; color: var(--muted);
  }
  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: 14px;
    padding: 14px 14px 14px 16px; margin-bottom: 10px;
  }
  .row { display: flex; gap: 12px; align-items: center; }
  .txt { flex: 1; min-width: 0; }
  .en { margin: 0; color: var(--muted); font-size: 16px; }
  .text { margin: 2px 0 2px; font-size: 30px; line-height: 1.15; font-weight: 700; overflow-wrap: anywhere; }
  .rom { margin: 0 0 2px; font-size: 17px; }
  .ph { margin: 0; color: var(--accent); font-size: 19px; }
  .note { margin: 8px 0 0; color: var(--muted); font-size: 15px; }
  .alt { border-top: 1px solid var(--line); margin-top: 12px; padding-top: 12px; }
  .alt .text { font-size: 22px; }
  .alt .ph { font-size: 17px; }
  .tag {
    display: inline-block; padding: 1px 8px; border-radius: 6px;
    background: var(--tag); color: var(--accent); font-size: 13px; font-weight: 600;
  }

  .btns { display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .play {
    width: 58px; height: 58px; border-radius: 50%; border: 0;
    background: var(--accent); color: var(--accent-ink);
    display: grid; place-items: center;
  }
  .alt .play { width: 46px; height: 46px; }
  .play svg { width: 40%; height: 40%; margin-left: 8%; fill: currentColor; }
  .play.on { opacity: .55; }
  .slow {
    border: 0; background: none; color: var(--muted);
    font: inherit; font-size: 13px; padding: 4px 6px; min-height: 28px;
  }
  .slow.on { color: var(--accent); }
  .txt[role="button"] { cursor: pointer; }

  /* Show mode: one phrase full screen, to turn the phone toward someone. */
  .show {
    position: fixed; inset: 0; z-index: 2;
    display: flex; flex-direction: column;
    background: var(--card); color: var(--text);
    padding: calc(env(safe-area-inset-top) + 16px) calc(env(safe-area-inset-right) + 20px)
      calc(env(safe-area-inset-bottom) + 16px) calc(env(safe-area-inset-left) + 20px);
    touch-action: none; user-select: none; -webkit-user-select: none;
  }
  .show[hidden] { display: none; }
  .show-en { margin: 0; color: var(--muted); font-size: 15px; text-align: center; }
  .show-fit { flex: 1; min-height: 0; display: grid; place-items: center; overflow: hidden; }
  .show-text { max-width: 100%; margin: 0; font-weight: 700; line-height: 1.15; text-align: center; overflow-wrap: normal; }
  .show-hint { margin: 0; color: var(--muted); font-size: 13px; text-align: center; }
  body.showing { overflow: hidden; }

  /* Listening: a floating button opens a sheet with hold-to-listen and the results. */
  body { padding-bottom: calc(env(safe-area-inset-bottom) + 88px); }
  .listen-fab {
    position: fixed; z-index: 1; left: 50%; transform: translateX(-50%);
    bottom: calc(env(safe-area-inset-bottom) + 16px);
    display: flex; align-items: center; gap: 8px; min-height: 48px; padding: 0 20px 0 16px;
    border: 0; border-radius: 24px; background: var(--accent); color: var(--accent-ink);
    font: inherit; font-size: 16px; font-weight: 600; box-shadow: 0 4px 16px rgba(0, 0, 0, .25);
  }
  .listen-fab svg, .listen-hold svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; }
  .listen-fab[hidden], body.showing .listen-fab { display: none; }
  .listen {
    position: fixed; z-index: 2; left: 0; right: 0; bottom: 0; max-height: 80vh; overflow-y: auto;
    background: var(--card); border-top: 1px solid var(--line); border-radius: 18px 18px 0 0;
    padding: 14px 16px calc(env(safe-area-inset-bottom) + 16px); box-shadow: 0 -6px 24px rgba(0, 0, 0, .2);
  }
  .listen[hidden] { display: none; }
  .listen-inner { max-width: 640px; margin: 0 auto; }
  .listen-top { display: flex; justify-content: space-between; align-items: center; }
  .listen-top b { font-size: 17px; }
  .listen-top button { border: 0; background: none; color: var(--accent); font: inherit; font-size: 15px; padding: 6px 0; }
  .listen-msg { color: var(--muted); font-size: 15px; margin: 8px 0; }
  .listen-hold {
    width: 100%; min-height: 72px; margin: 6px 0 4px; border: 0; border-radius: 14px;
    background: var(--accent); color: var(--accent-ink); font: inherit; font-size: 18px; font-weight: 600;
    display: flex; align-items: center; justify-content: center; gap: 10px;
    touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
  }
  .listen-hold[hidden] { display: none; }
  .listen-hold.on { opacity: .7; }
  .listen-hold:disabled { opacity: .45; }
  .heard { border-top: 1px solid var(--line); margin-top: 12px; padding-top: 12px; }
  .heard-en { margin: 0; font-size: 22px; font-weight: 700; }
  .heard .text { font-size: 20px; }
  .heard .en { font-size: 14px; }
  .lab-bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 8px; font-size: 14px; color: var(--muted); }
  .lab-bar button, .lab-truth button { border: 1px solid var(--line); border-radius: 8px; background: none; color: var(--accent); font: inherit; font-size: 14px; padding: 4px 10px; }
  .lab-bar select, .lab-truth select { font: inherit; font-size: 14px; max-width: 100%; border: 1px solid var(--line); border-radius: 8px; background: var(--card); color: var(--text); padding: 4px; }
  .lab-truth { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-top: 8px; font-size: 13px; color: var(--muted); }
  .lab-truth.done select { border-color: var(--accent); }
  .replies { border-top: 1px solid var(--line); margin-top: 12px; padding-top: 8px; }
  .replies summary { color: var(--muted); font-size: 14px; padding: 4px 0; cursor: pointer; }
  .replies .row { margin-top: 10px; }
  .replies .text { font-size: 20px; }
  .replies .en { font-size: 15px; }
  .replies .play { width: 40px; height: 40px; }
  button { cursor: pointer; }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
</style>
<!-- scripts/build.py replaces this with the language's colours, overriding the blue above. -->
<style>/*{{THEME}}*/</style>
</head>
<body>
<main>
  <header>
    <div class="clock"><div class="left"><div class="who" role="group" aria-label="Speaker"><button data-g="m">He</button><button data-g="f">She</button></div><a id="lang" class="lang" href="../?pick" aria-label="Change language"></a><button id="find" class="find" aria-label="Search phrases"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5L21 21"/></svg></button></div><b id="time">--:--</b></div>
    <p id="offline" class="offline" role="status" hidden></p>
    <nav id="tabs"></nav>
    <div id="search" class="search" role="search" hidden><input id="q" type="search" placeholder="Search all phrases" aria-label="Search all phrases" autocomplete="off" autocorrect="off" spellcheck="false"><button id="search-close">Cancel</button></div>
  </header>
  <section id="now"></section>
  <section id="always"></section>
</main>
<button id="listen-fab" class="listen-fab" aria-label="Listen to a reply" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21"/></svg>Listen</button>
<div id="listen" class="listen" role="dialog" aria-label="Listen to a reply" hidden>
  <div class="listen-inner">
    <div class="listen-top"><b>What did they say?</b><button id="listen-close">Close</button></div>
    <p id="listen-msg" class="listen-msg"></p>
    <button id="listen-get" class="listen-hold" hidden></button>
    <button id="listen-hold" class="listen-hold" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21"/></svg><span>Hold while they speak</span></button>
    <div id="listen-out"></div>
    <div id="lab-bar" class="lab-bar" hidden></div>
  </div>
</div>
<div id="show" class="show" role="dialog" aria-modal="true" hidden>
  <p class="show-en"></p>
  <div class="show-fit"><p class="show-text"></p></div>
  <p class="show-hint">Tap to close</p>
</div>

<script>
(() => {
  const PLAY = '<svg viewBox="0 0 10 12" aria-hidden="true"><path d="M0 0L10 6L0 12Z"/></svg>';
  const SLOW_RATE = 0.7;
  const audio = new Audio();
  audio.preload = 'auto';
  const clips = new Map();      // "gender/id" -> object URL, or null when the clip is missing
  let data, lang, timed, chosen = null, lastAuto = null, activeBtn = null, last = null;
  let gender = 'm';
  try { if (localStorage.getItem('gender') === 'f') gender = 'f'; } catch {}

  // Feminine overrides (obrigada etc.) live in a phrase's "f" object; clips in audio/f/.
  const form = item => gender === 'f' && item.f ? { ...item, ...item.f } : item;
  const clipKey = (id, g = gender) => `${g}/${id}`;
  // Replies are the other person speaking, so they take the voice opposite the user's.
  const other = g => g === 'f' ? 'm' : 'f';
  const voiceOf = (item, g = gender) => item.reply ? other(g) : g;
  // Human recordings, where the build found any, replace the TTS clip for their voice.
  const human = { m: new Set(), f: new Set() };
  const clipPath = (id, g = gender) => human[g].has(id)
    ? (g === 'f' ? `audio-human/f/${id}.m4a` : `audio-human/${id}.m4a`)
    : (g === 'f' ? `audio/f/${id}.mp3` : `audio/${id}.mp3`);

  // Non-breaking hyphens keep each phonetic word on one line.
  const nb = s => s.replace(/-/g, '\u2011');

  const el = (tag, cls, text) => {
    const n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  };

  const inBucket = (h, [a, b]) => a < b ? h >= a && h < b : h >= a || h < b;

  // Device voice fallback: the named voice for the exact locale (Joana for pt-PT on iOS),
  // then any voice for that locale or the listed stand-ins, then any voice for the language.
  function pickVoice() {
    const vs = speechSynthesis.getVoices();
    const norm = v => v.lang.replace('_', '-').toLowerCase();
    const want = [lang, ...(data.deviceLangs || [])].map(l => l.toLowerCase());
    return (data.deviceVoice && vs.find(v => norm(v) === want[0] && v.name.includes(data.deviceVoice)))
      || want.map(l => vs.find(v => norm(v) === l)).find(Boolean)
      || vs.find(v => norm(v).startsWith(want[0].slice(0, 2)));
  }

  function speak(text, slow) {
    if (!('speechSynthesis' in window)) return;
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = lang;
    const v = pickVoice();
    if (v) { u.voice = v; u.lang = v.lang; }
    u.rate = slow ? 0.6 : 0.9;
    u.onend = u.onerror = clearActive;
    speechSynthesis.speak(u);
  }

  function clearActive() {
    if (activeBtn) activeBtn.classList.remove('on');
    activeBtn = null;
  }

  // btn is the button to highlight while playing; replays from the lock screen pass none.
  function play(item, slow, btn) {
    audio.pause();
    if ('speechSynthesis' in window) speechSynthesis.cancel();
    clearActive();
    if (btn) { activeBtn = btn; btn.classList.add('on'); }
    last = item;
    item = form(item);
    nowPlaying(item);
    const g = voiceOf(item);
    const key = clipKey(item.id, g);
    const text = item.say || item.text;
    const cached = clips.get(key);
    if (cached === null) return speak(text, slow);
    // play() must start synchronously inside the tap for iOS, so no awaits before it.
    audio.src = cached || clipPath(item.id, g);
    audio.playbackRate = slow ? SLOW_RATE : 1;
    audio.preservesPitch = audio.webkitPreservesPitch = true;
    audio.onended = clearActive;
    audio.onerror = () => { clips.set(key, null); speak(text, slow); };
    audio.play().catch(err => {
      if (err.name !== 'AbortError') { clips.set(key, null); speak(text, slow); }
    });
  }

  // Lock screen and earbuds: play replays the last phrase, next track replays it slowly,
  // previous track replays it at normal speed. iOS shows these only for <audio> playback,
  // so phrases spoken by the device voice get no lock-screen entry.
  const media = 'mediaSession' in navigator ? navigator.mediaSession : null;

  function nowPlaying(item) {
    if (!media || !('MediaMetadata' in window)) return;
    media.metadata = new MediaMetadata({
      title: item.text,
      artist: item.en || '',
      album: `Mimik ${data.name}`,
      artwork: [{ src: 'icon-512.png', sizes: '512x512', type: 'image/png' }],
    });
  }

  function setupMedia() {
    if (!media) return;
    const replay = slow => () => { if (last) play(last, slow); };
    const actions = {
      play: replay(false),
      pause: () => audio.pause(),
      previoustrack: replay(false),
      nexttrack: replay(true),
    };
    for (const [a, fn] of Object.entries(actions)) {
      try { media.setActionHandler(a, fn); } catch {}
    }
    audio.addEventListener('play', () => { media.playbackState = 'playing'; });
    for (const ev of ['pause', 'ended']) audio.addEventListener(ev, () => { media.playbackState = 'paused'; });
  }

  function controls(item) {
    const box = el('div', 'btns');
    const p = el('button', 'play');
    p.innerHTML = PLAY;
    p.setAttribute('aria-label', `Play: ${item.text}`);
    p.onclick = () => play(item, false, p);
    box.append(p);
    const s = el('button', 'slow', 'slow');
    s.setAttribute('aria-label', `Play slowly: ${item.text}`);
    s.onclick = () => play(item, true, s);
    box.append(s);
    return box;
  }

  // Target-language line, then the romanization where the script needs one (Japanese).
  function lines(box, item) {
    const t = el('p', 'text', item.text);
    t.lang = lang;
    box.append(t);
    if (item.rom) box.append(el('p', 'rom', item.rom));
    box.append(el('p', 'ph', nb(item.ph)));
  }

  // Show mode: the phrase as large as fits, with the screen kept awake while it is open.
  // Wake locks drop when the page is hidden, so it is retaken on return.
  const showEl = document.getElementById('show');
  let wake = null, swipeFrom = null;

  async function holdWake() {
    if (!('wakeLock' in navigator) || wake) return;
    try {
      const w = await navigator.wakeLock.request('screen');
      if (showEl.hidden) w.release(); else { wake = w; w.onrelease = () => { if (wake === w) wake = null; }; }
    } catch {}
  }

  // Largest font size at which the text fits the screen without splitting a word.
  function fitShow() {
    const area = showEl.querySelector('.show-fit');
    const t = showEl.querySelector('.show-text');
    let lo = 16, hi = Math.min(area.clientHeight, 320);
    while (hi - lo > 1) {
      const mid = (lo + hi) / 2;
      t.style.fontSize = mid + 'px';
      if (t.scrollWidth <= area.clientWidth && t.scrollHeight <= area.clientHeight) lo = mid; else hi = mid;
    }
    t.style.fontSize = lo + 'px';
  }

  function openShow(item) {
    showEl.querySelector('.show-en').textContent = item.en || '';
    const t = showEl.querySelector('.show-text');
    t.textContent = item.text;
    t.lang = lang;
    showEl.hidden = false;
    document.body.classList.add('showing');
    fitShow();
    showEl.focus();
    holdWake();
  }

  function closeShow() {
    if (showEl.hidden) return;
    showEl.hidden = true;
    document.body.classList.remove('showing');
    if (wake) { wake.release(); wake = null; }
  }

  showEl.tabIndex = -1;
  showEl.addEventListener('click', closeShow);
  // A swipe never produces a click, so it is caught here.
  showEl.addEventListener('pointerdown', e => { swipeFrom = [e.clientX, e.clientY]; });
  showEl.addEventListener('pointerup', e => {
    if (swipeFrom && Math.hypot(e.clientX - swipeFrom[0], e.clientY - swipeFrom[1]) > 30) closeShow();
    swipeFrom = null;
  });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeShow(); });
  window.addEventListener('resize', () => { if (!showEl.hidden) fitShow(); });
  document.addEventListener('visibilitychange', () => { if (!document.hidden && !showEl.hidden) holdWake(); });

  // The text side of a card row opens show mode; the play buttons sit beside it.
  function showable(box, item, en) {
    box.setAttribute('role', 'button');
    box.tabIndex = 0;
    box.setAttribute('aria-label', `Show full screen: ${item.text}`);
    const open = () => openShow({ en, text: item.text });
    box.onclick = open;
    box.onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); open(); } };
  }

  function card(item) {
    item = form(item);
    const c = el('article', 'card');
    const row = el('div', 'row');
    const t = el('div', 'txt');
    t.append(el('p', 'en', item.en));
    lines(t, item);
    if (item.note) t.append(el('p', 'note', item.note));
    showable(t, item, item.en);
    row.append(t, controls(item));
    c.append(row);
    for (const a of item.alt || []) {
      const r = el('div', 'row alt');
      const at = el('div', 'txt');
      at.append(el('span', 'tag', a.tag));
      lines(at, a);
      const en = `${item.en} (${a.tag})`;
      showable(at, a, en);
      r.append(at, controls({ en, ...a }));
      c.append(r);
    }
    // Likely responses from the other person, collapsed: heard, not said, so no phonetics.
    if (item.replies && item.replies.length) {
      const d = el('details', 'replies');
      d.append(el('summary', null, "What you'll hear"));
      for (const rep of item.replies) {
        const r = el('div', 'row');
        const rt = el('div', 'txt');
        const t = el('p', 'text', rep.text);
        t.lang = lang;
        rt.append(t);
        if (rep.rom) rt.append(el('p', 'rom', rep.rom));
        rt.append(el('p', 'en', rep.en));
        r.append(rt, controls({ ...rep, reply: true }));
        d.append(r);
      }
      c.append(d);
    }
    return c;
  }

  function renderSection(target, sec) {
    target.append(el('h2', null, sec.title));
    for (const p of sec.phrases) target.append(card(p));
  }

  // Search: matches English, native text (both genders) and romanization across every
  // section, including regional rows and replies, and shows the whole card. Accents and
  // macrons on Latin letters are ignored (Japanese voicing marks are kept) and doubled vowels
  // collapsed, so "cafe" finds café and both "kado"
  // and "kaado" find kādo.
  let query = '';
  const fold = s => (s || '').normalize('NFD').replace(/(\p{Script=Latin})\p{M}+/gu, '$1').toLowerCase().replace(/([aeiou])\1+/g, '$1');

  function haystack(p) {
    const parts = [p.en, p.text, p.rom, p.f && p.f.text];
    for (const a of p.alt || []) parts.push(a.tag, a.text, a.rom);
    for (const r of p.replies || []) parts.push(r.en, r.text, r.rom);
    return fold(parts.filter(Boolean).join(' \n '));
  }

  function renderResults(target) {
    const terms = fold(query).split(/\s+/).filter(Boolean);
    let n = 0;
    for (const sec of data.sections) {
      const hits = sec.phrases.filter(p => { const h = haystack(p); return terms.every(t => h.includes(t)); });
      if (!hits.length) continue;
      n += hits.length;
      target.append(el('h2', null, sec.title));
      for (const p of hits) target.append(card(p));
    }
    if (!n) target.append(el('p', 'empty', `Nothing matches \u201c${query.trim()}\u201d.`));
  }

  function openSearch() {
    document.getElementById('tabs').hidden = true;
    document.getElementById('search').hidden = false;
    document.getElementById('q').focus();
  }

  function closeSearch() {
    const q = document.getElementById('q');
    q.value = query = '';
    q.blur();
    document.getElementById('search').hidden = true;
    document.getElementById('tabs').hidden = false;
    render();
  }

  function currentId() {
    const h = new Date().getHours();
    return (timed.find(s => inBucket(h, s.hours)) || timed[0]).id;
  }

  function render() {
    const nowId = currentId();
    // Follow the clock unless the user picked a tab during this time bucket.
    if (nowId !== lastAuto) { chosen = null; lastAuto = nowId; }
    const show = chosen || nowId;

    const tabs = document.getElementById('tabs');
    tabs.replaceChildren();
    for (const s of timed) {
      const b = el('button', s.id === nowId ? 'now' : '', s.title);
      b.setAttribute('aria-pressed', String(s.id === show));
      b.onclick = () => { chosen = s.id === nowId ? null : s.id; render(); };
      tabs.append(b);
    }

    const now = document.getElementById('now');
    now.replaceChildren();
    document.getElementById('always').hidden = !!query.trim();
    if (query.trim()) renderResults(now);
    else renderSection(now, timed.find(s => s.id === show));
  }

  function tick() {
    const d = new Date();
    document.getElementById('time').textContent =
      d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    if (currentId() !== lastAuto) render();
    checkOffline();
  }

  // Header badge: the newest worker reports how many of this language's clips it holds.
  // It appears only while clips are being saved or are missing, says "Offline ready!" once
  // they are all in, then hides. Polls quickly while a fill runs; otherwise the 20 s tick
  // and coming online recheck it.
  let regReady = null, offlineTimer = null, hideTimer = null;
  function askWorker(w, refill) {
    return new Promise(resolve => {
      const ch = new MessageChannel();
      ch.port1.onmessage = e => resolve(e.data);
      // A worker from before this feature never answers.
      setTimeout(() => resolve(null), 3000);
      w.postMessage({ type: 'offline-status', refill }, [ch.port2]);
    });
  }

  async function checkOffline() {
    if (!regReady) return;
    clearTimeout(offlineTimer);
    const reg = await regReady.catch(() => null);
    const w = reg && (reg.installing || reg.waiting || reg.active);
    const st = w && await askWorker(w, navigator.onLine);
    const badge = document.getElementById('offline');
    if (!st) { badge.hidden = true; return; }
    const ready = st.shell && st.cached === st.total;
    if (ready && !st.filling) {
      if (!badge.hidden && !hideTimer) {
        badge.textContent = 'Offline ready!';
        badge.classList.remove('warn');
        hideTimer = setTimeout(() => { badge.hidden = true; hideTimer = null; }, 3000);
      }
      return;
    }
    clearTimeout(hideTimer);
    hideTimer = null;
    const count = `${st.cached}/${st.total}`;
    badge.textContent = st.filling ? `Saving for offline: ${count}`
      : `Offline: ${count} saved. Open while online to refill.`;
    badge.classList.toggle('warn', !st.filling);
    badge.hidden = false;
    if (st.filling) offlineTimer = setTimeout(checkOffline, 1000);
  }

  // Preload clips as blobs: avoids Safari's range-request issues and lets play() run synchronously.
  async function preload(g) {
    const items = data.sections.flatMap(s => s.phrases.flatMap(p =>
      [p, ...(p.alt || []), ...(p.replies || []).map(r => ({ ...r, reply: true }))]));
    await Promise.all(items.filter(it => !clips.has(clipKey(it.id, voiceOf(it, g)))).map(async it => {
      const v = voiceOf(it, g);
      const key = clipKey(it.id, v);
      try {
        const r = await fetch(clipPath(it.id, v));
        if (!r.ok) throw 0;
        clips.set(key, URL.createObjectURL(await r.blob()));
      } catch { clips.set(key, null); }
    }));
  }

  function renderAlways() {
    const always = document.getElementById('always');
    always.replaceChildren();
    for (const s of data.sections.filter(s => !s.hours)) renderSection(always, s);
  }

  function setGender(g) {
    gender = g;
    try { localStorage.setItem('gender', g); } catch {}
    for (const b of document.querySelectorAll('.who button')) b.setAttribute('aria-pressed', String(b.dataset.g === g));
    if (!data) return;
    audio.pause();
    if ('speechSynthesis' in window) speechSynthesis.cancel();
    clearActive();
    renderAlways();
    render();
    preload(g);
  }

  // Listening (Feature 10): hold a button while the other person speaks. The phone transcribes
  // the audio with Whisper and shows which of this language's replies it was, with its English,
  // or "not sure". Audio never leaves the phone and is dropped once transcribed. The model is an
  // optional 80 MB download, shared by every language. Choices are from docs/spike-interpreter.md.
  // The /lab/<code>/ copy that build.py writes sets LAB: it logs every attempt for tuning
  // (see labEntry below), offers a model switch, and does not register the worker.
  const LAB = false;
  const LAB_KEY = 'mimik-lab-listen';
  const ASR_LIB = 'https://cdn.jsdelivr.net/npm/@huggingface/transformers@4.3.2';
  const ASR_MODELS = { base: ['onnx-community/whisper-base', 80], tiny: ['onnx-community/whisper-tiny', 44] };
  let labModel = 'base';
  try { if (LAB && ASR_MODELS[localStorage.getItem('lab-model')]) labModel = localStorage.getItem('lab-model'); } catch {}
  const [ASR_MODEL, ASR_MB] = ASR_MODELS[labModel];
  // Microphone processing. Off, iOS gives the raw signal with no automatic gain: real-world speech
  // at arm's length peaked around 0.01 (-40 dB). On, it applies the voice processing used for
  // calls, which includes gain: the same speech peaked around 0.4, and recognition improved. On is
  // the default; the lab can still switch it off to compare.
  let labVoice = true;
  try { if (LAB && localStorage.getItem('lab-voice') === '0') labVoice = false; } catch {}
  const micAudio = () => ({ echoCancellation: labVoice, noiseSuppression: true, autoGainControl: true });
  // Input. Headphone microphones (AirPods) are tuned to the wearer's voice, and on iOS their
  // recordings were cut at 0.53 s or empty; the person to be heard is across the table. So the
  // phone's own microphone is used whenever it is listed, with headphones still playing audio.
  // The lab can switch to the system's choice to compare.
  let labPhoneMic = true;
  try { if (LAB && localStorage.getItem('lab-input') === 'system') labPhoneMic = false; } catch {}
  const BUILT_IN = /iphone|ipad|built-?in|internal/i;
  // Capture. 'recorder' is MediaRecorder (AAC on iOS), decoded afterwards: proven on the phone's
  // microphone with voice processing. 'webaudio' takes the raw samples from the audio graph; it
  // did better with AirPods connected, which listening no longer supports (see headphonesIn),
  // so it stays a lab option.
  let labCapture = 'recorder';
  try { if (LAB && localStorage.getItem('lab-capture') === 'webaudio') labCapture = 'webaudio'; } catch {}
  const MATCH_MIN = 0.6;
  const READY_KEY = 'listen-ready';
  const listenEl = document.getElementById('listen');
  const holdBtn = document.getElementById('listen-hold');
  const getBtn = document.getElementById('listen-get');
  let asr = null, asrLoading = null, asrProgress = null, mic = null, recorder = null, recChunks = [], matchers = null, hearing = false;

  // Comparison drops case, accents, punctuation and spaces, and squashes runaway repeats.
  const matchKey = s => (s || '').toLowerCase().normalize('NFD').replace(/[\p{M}\p{P}\p{S}\s]/gu, '').replace(/(.)\1{3,}/gu, '$1');
  function editDistance(a, b) {
    a = [...a]; b = [...b];
    let prev = Array.from({ length: b.length + 1 }, (_, j) => j);
    for (let i = 1; i <= a.length; i++) {
      const cur = [i];
      for (let j = 1; j <= b.length; j++) cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
      prev = cur;
    }
    return prev[b.length];
  }

  // Candidates are the replies, plus the user's own phrases as distractors: the phone hears its
  // owner too, and a transcript closest to one of those is not a reply.
  function buildMatchers() {
    const list = new Map();
    for (const sec of data.sections) for (const p of sec.phrases) for (const r of p.replies || []) {
      const key = matchKey(r.text);
      if (key && !list.has(key)) list.set(key, { key, reply: { ...r, reply: true }, phrase: p });
    }
    for (const sec of data.sections) for (const p of sec.phrases) {
      for (const x of [p, p.f, ...(p.alt || [])]) {
        if (!x || !x.text) continue;
        for (const part of [x.text, ...x.text.split('/')]) {
          const key = matchKey(part);
          if (key && !list.has(key)) list.set(key, { key, mine: true, text: part.trim(), en: x.tag ? `${p.en} (${x.tag})` : p.en, item: x === p.f ? form(p) : x });
        }
      }
    }
    return [...list.values()];
  }

  // People rarely say only the expected line ("Boa noite! Bem-vindos! Têm reserva?"), so the
  // whole transcript, each sentence and each comma-separated part are matched separately. A
  // part's closest candidate wins it if it scores MATCH_MIN or more. The best reply among the
  // winners is shown; failing that, the best of the user's own phrases, labelled as such.
  // Returns { match, phrase, ranked }, ranked being each candidate at its best score.
  function matchReply(transcript) {
    const parts = new Set([transcript, ...transcript.split(/[.?!。？！]+/), ...transcript.split(/[.?!。？！,、]+/)].map(matchKey).filter(k => [...k].length >= 4));
    if (!parts.size) parts.add(matchKey(transcript));
    const best = new Map();
    const winners = [];
    for (const t of parts) {
      let top = null;
      for (const c of matchers) {
        const score = 1 - editDistance(t, c.key) / Math.max([...t].length, [...c.key].length, 1);
        if (!best.has(c) || score > best.get(c)) best.set(c, score);
        if (!top || score > top.score) top = { ...c, score };
      }
      if (top && top.score >= MATCH_MIN) winners.push(top);
    }
    winners.sort((a, b) => b.score - a.score);
    const ranked = [...best].map(([c, score]) => ({ ...c, score })).sort((a, b) => b.score - a.score);
    const match = winners.find(w => !w.mine) || null;
    return { match, phrase: match ? null : winners[0] || null, ranked };
  }

  function loadAsr() {
    asrLoading ||= (async () => {
      const { pipeline, env } = await import(ASR_LIB);
      env.allowLocalModels = false;
      const p = await pipeline('automatic-speech-recognition', ASR_MODEL, {
        device: 'wasm',
        dtype: 'q8',
        progress_callback: e => { if (e.status === 'progress_total' && asrProgress) asrProgress(e.loaded, e.total); },
      });
      try { localStorage.setItem(READY_KEY, '1'); } catch {}
      return (asr = p);
    })().catch(err => { asrLoading = null; throw err; });
    return asrLoading;
  }

  const listenMsg = t => { document.getElementById('listen-msg').textContent = t; };
  const modelSaved = () => { try { return localStorage.getItem(READY_KEY) === '1'; } catch { return false; } };

  // One big button takes the place of the hold button until listening can start: it offers the
  // download, shows progress while disabled, and gives way to "Hold while they speak" when ready.
  function stepButton(label, enabled) {
    holdBtn.hidden = true;
    getBtn.hidden = false;
    getBtn.disabled = !enabled;
    getBtn.textContent = label;
  }

  function offerDownload(msg) {
    listenMsg(msg);
    stepButton(`Download (${ASR_MB} MB)`, true);
  }

  async function prepareListening() {
    const saved = asr || modelSaved();
    stepButton(asr ? 'Starting...' : saved ? 'Loading...' : 'Downloading...', false);
    if (!saved) listenMsg('Keep this open until the download finishes.');
    asrProgress = saved ? null : (loaded, total) => { getBtn.textContent = `Downloading ${Math.round(loaded / 1e6)} of ${Math.round(total / 1e6)} MB`; };
    try {
      await loadAsr();
    } catch (err) {
      try { localStorage.removeItem(READY_KEY); } catch {}
      offerDownload(navigator.onLine
        ? `Could not load the listening model (${err.message || err}). Try again on Wi-Fi.`
        : 'The listening model is not on this phone. Connect to the internet to download it.');
      if (navigator.onLine) getBtn.textContent = 'Try again';
      return;
    }
    if (listenEl.hidden) return;
    getBtn.textContent = 'Starting the microphone...';
    try {
      // Asked for here, not on the first hold, so the permission prompt does not eat the press.
      mic ||= await openMic();
    } catch {
      listenMsg('Listening needs the microphone. Allow it for this site in Settings, then try again.');
      stepButton('Try again', true);
      return;
    }
    if (listenEl.hidden) return releaseMic();
    getBtn.hidden = true;
    await showReady();
  }

  // Headphones. In six lab sessions with AirPods connected, iOS gave the page broken recordings
  // from either microphone: cut at 0.53 s or empty with MediaRecorder, all zeros after a clip had
  // played with Web Audio, and the AirPods' own microphone hears the wearer, not the person across
  // the table. So listening is paused while any input other than the phone's own is listed (labels
  // are only listed once the microphone has been allowed), and resumes when it goes. The lab
  // keeps the button, with a warning, so the case stays testable.
  async function headphonesIn() {
    try {
      return (await navigator.mediaDevices.enumerateDevices())
        .some(d => d.kind === 'audioinput' && d.label && !BUILT_IN.test(d.label));
    } catch { return false; }
  }

  async function showReady() {
    if (listenEl.hidden || !asr) return;
    const phones = await headphonesIn();
    if (phones) {
      listenMsg(LAB
        ? 'Headphones are connected: the app would pause listening here. The lab records anyway.'
        : 'Listening does not work while headphones are connected: iOS gives the app no usable sound. Disconnect them, or turn Bluetooth off, and the button comes back.');
      holdBtn.hidden = !LAB;
    } else {
      listenMsg('Hold the button while they speak and let go when they stop. Audio stays on this phone and is discarded after.');
      holdBtn.hidden = false;
    }
  }

  // Opens the microphone and drops it when iOS ends its track (a route change), so the next
  // press opens it again on whatever input is now current.
  async function openMic() {
    let audioOpts = micAudio();
    if (labPhoneMic) {
      // Labels are only listed once microphone permission has been granted; before that, or if
      // no built-in input is found, the system's choice is used.
      try {
        const own = (await navigator.mediaDevices.enumerateDevices()).find(d => d.kind === 'audioinput' && BUILT_IN.test(d.label));
        if (own && own.deviceId) audioOpts = { ...audioOpts, deviceId: { exact: own.deviceId } };
      } catch {}
    }
    let stream;
    try { stream = await navigator.mediaDevices.getUserMedia({ audio: audioOpts }); }
    catch (err) {
      if (!audioOpts.deviceId) throw err;
      stream = await navigator.mediaDevices.getUserMedia({ audio: micAudio() });
    }
    // The first opening has no labels to choose from; once it has them, reopen on the phone's own.
    if (labPhoneMic && !audioOpts.deviceId) {
      const t = stream.getAudioTracks()[0];
      if (t && !BUILT_IN.test(t.label)) {
        const own = (await navigator.mediaDevices.enumerateDevices()).find(d => d.kind === 'audioinput' && BUILT_IN.test(d.label));
        if (own && own.deviceId) {
          for (const x of stream.getTracks()) x.stop();
          try { stream = await navigator.mediaDevices.getUserMedia({ audio: { ...micAudio(), deviceId: { exact: own.deviceId } } }); }
          catch { stream = await navigator.mediaDevices.getUserMedia({ audio: micAudio() }); }
        }
      }
    }
    for (const t of stream.getAudioTracks()) for (const ev of ['mute', 'unmute']) t.addEventListener(ev, () => mark(`track ${ev}`));
    for (const t of stream.getAudioTracks()) t.addEventListener('ended', () => {
      mark('track ended');
      labEntry({ outcome: 'microphone ended', track: { label: t.label } });
      if (mic === stream && !recorder) releaseMic();
    });
    return stream;
  }

  function micState() {
    const t = mic && mic.getAudioTracks()[0];
    return t ? { label: t.label, state: t.readyState, muted: t.muted, enabled: t.enabled } : null;
  }

  function releaseMic() {
    if (mic) for (const t of mic.getTracks()) t.stop();
    mic = null;
  }

  function openListen() {
    if (!data) return;
    matchers ||= buildMatchers();
    listenEl.hidden = false;
    document.getElementById('listen-fab').hidden = true;
    labRender();
    if (asr || modelSaved()) prepareListening();
    else offerDownload(`To understand replies, this phone needs a one-time ${ASR_MB} MB download, shared by every language and kept for offline use. Use Wi-Fi.`);
  }

  function closeListen() {
    if (listenEl.hidden) return;
    if (recorder) { recorder.onstop = null; recorder.stop(); recorder = null; }
    recChunks = [];
    holdBtn.classList.remove('on');
    listenEl.hidden = true;
    document.getElementById('listen-fab').hidden = false;
    releaseMic();
  }

  // iOS can mute or end an open microphone track (after the app plays audio, or after a switch
  // away), and a recorder on it captures silence. Such a track is replaced before recording.
  const micLive = () => mic && mic.getAudioTracks().some(t => t.readyState === 'live' && !t.muted && t.enabled);

  // A hold that iOS reads as a long press (about half a second) used to end in pointercancel,
  // cutting recordings at 0.53 s. touchstart is cancelled so the system never takes the touch,
  // a touch's pointercancel is ignored, and the hold ends at the lift-off (pointerup or touchend),
  // a touchcancel, or after MAX_HOLD_MS as a safety net.
  const MAX_HOLD_MS = 30000;
  let pressed = false, pressedAt = 0, holdTimer = null;
  async function startHearing(e) {
    e.preventDefault();
    pressed = true;
    pressedAt = performance.now();
    if (!asr || recorder || hearing) return;
    // Feedback at once, even if the microphone still has to open.
    holdBtn.classList.add('on');
    holdBtn.querySelector('span').textContent = 'Listening... let go when they stop';
    timeline = [];
    mark(releasePlayback() ? 'playback released' : 'no playback to release');
    // An AudioContext has to be created inside the press for iOS to let it run.
    const ctx = labCapture === 'webaudio' ? new AudioContext() : null;
    if (!micLive()) {
      releaseMic();
      try { mic = await openMic(); }
      catch (err) {
        labEntry({ outcome: 'error', stage: 'open microphone', error: String(err && err.message || err) });
        listenMsg('Could not open the microphone. If you just connected or disconnected headphones, try again; otherwise allow it in Settings.');
        resetHoldButton();
        if (ctx) ctx.close();
        return;
      }
      mark('microphone opened');
      // Released while the microphone was reopening: nothing to record.
      if (!pressed) { resetHoldButton(); if (ctx) ctx.close(); return; }
    }
    // Keeps the release on this button even if the finger or pointer drifts off it.
    try { holdBtn.setPointerCapture(e.pointerId); } catch {}
    recChunks = [];
    try {
      if (ctx) {
        recorder = await startGraphCapture(ctx);
      } else {
        recorder = new MediaRecorder(mic);
        recorder.ondataavailable = ev => { mark(`data ${ev.data.size} bytes`); if (ev.data.size) recChunks.push(ev.data); };
        recorder.onerror = ev => labEntry({ outcome: 'error', stage: 'recording', error: String(ev.error && ev.error.message || ev.error || 'recorder error'), track: micState() });
        for (const ev of ['pause', 'resume', 'stop']) recorder.addEventListener(ev, () => mark(`recorder ${ev}`));
        recorder.start();
      }
      recorder.startedAt = performance.now();
      mark('recording started');
    } catch (err) {
      recorder = null;
      releaseMic();
      if (ctx) ctx.close();
      labEntry({ outcome: 'error', stage: 'start recording', error: String(err && err.message || err), track: micState() });
      listenMsg('Could not start recording. Try again.');
      resetHoldButton();
      return;
    }
    // Released while recording was starting.
    if (!pressed) return stopHearing({ type: 'released while starting', preventDefault() {} });
    clearTimeout(holdTimer);
    holdTimer = setTimeout(() => stopHearing({ type: 'timeout', preventDefault() {} }), MAX_HOLD_MS);
  }

  // With AirPods connected, recordings made after a clip had played were all zeros, even on a
  // freshly opened microphone: iOS kept the page's audio in playback. So before recording, the
  // player lets go of its clip, speech stops, and the lock-screen entry is cleared. Returns
  // whether there was a clip loaded.
  function releasePlayback() {
    const had = !!audio.getAttribute('src');
    audio.pause();
    if (had) { audio.removeAttribute('src'); audio.load(); }
    if ('speechSynthesis' in window) speechSynthesis.cancel();
    if (media) { try { media.playbackState = 'none'; media.metadata = null; } catch {} }
    clearActive();
    return had;
  }

  function resetHoldButton() {
    holdBtn.classList.remove('on');
    holdBtn.querySelector('span').textContent = 'Hold while they speak';
  }

  // Lab timeline of one hold: what the microphone and recorder did, in ms from the press.
  let timeline = [];
  const mark = what => { if (LAB && timeline.length < 40) timeline.push([Math.round(performance.now() - pressedAt), what]); };

  // Raw capture from the audio graph: the microphone feeds a ScriptProcessorNode that copies
  // each block of samples. Returns an object shaped enough like a MediaRecorder for stopHearing.
  async function startGraphCapture(ctx) {
    if (ctx.state !== 'running') await ctx.resume();
    const src = ctx.createMediaStreamSource(mic);
    const node = ctx.createScriptProcessor(4096, 1, 1);
    const blocks = [];
    node.onaudioprocess = ev => {
      if (!blocks.length) mark('first samples');
      blocks.push(new Float32Array(ev.inputBuffer.getChannelData(0)));
    };
    src.connect(node);
    node.connect(ctx.destination);
    ctx.onstatechange = () => mark(`audio context ${ctx.state}`);
    return {
      graph: true, state: 'recording', mimeType: `pcm/${ctx.sampleRate}`,
      async finish() {
        this.state = 'inactive';
        src.disconnect();
        node.disconnect();
        const n = blocks.reduce((a, b) => a + b.length, 0);
        const rate = ctx.sampleRate;
        await ctx.close();
        if (!n) return new Float32Array(0);
        const buf = new AudioBuffer({ length: n, numberOfChannels: 1, sampleRate: rate });
        let o = 0;
        for (const b of blocks) { buf.copyToChannel(b, 0, o); o += b.length; }
        const off = new OfflineAudioContext(1, Math.ceil(n * 16000 / rate), 16000);
        const s = off.createBufferSource();
        s.buffer = buf;
        s.connect(off.destination);
        s.start();
        return (await off.startRendering()).getChannelData(0);
      },
    };
  }

  async function decode16k(buf) {
    const ab = await new OfflineAudioContext(1, 16000, 16000).decodeAudioData(buf);
    if (ab.numberOfChannels === 1) return ab.getChannelData(0);
    const out = new Float32Array(ab.length);
    for (let c = 0; c < ab.numberOfChannels; c++) ab.getChannelData(c).forEach((v, i) => { out[i] += v / ab.numberOfChannels; });
    return out;
  }

  async function stopHearing(e) {
    if (e.type === 'pointercancel' && e.pointerType === 'touch') return;
    e.preventDefault();
    pressed = false;
    clearTimeout(holdTimer);
    const heldMs = performance.now() - pressedAt;
    const r = recorder;
    if (!r) {
      // Released before recording began (the microphone was still opening); startHearing tidies up.
      return;
    }
    recorder = null;
    resetHoldButton();
    const released = performance.now();
    mark(`released (${e.type})`);
    // iOS ends the microphone's track when the audio route changes (headphones connecting, say),
    // and the recorder stops by itself; stop() on it would throw.
    const stoppedEarly = !r.graph && r.state === 'inactive';
    let graphPcm = null;
    if (r.graph) graphPcm = await r.finish();
    else if (!stoppedEarly) await new Promise(res => { r.onstop = res; r.stop(); });
    const blob = r.graph ? null : new Blob(recChunks, { type: r.mimeType || 'audio/mp4' });
    const capture = {
      method: r.graph ? 'webaudio' : 'recorder', mime: r.mimeType, bytes: r.graph ? graphPcm.length * 4 : blob.size, chunks: recChunks.length,
      track: micState(), endedBy: e.type, heldMs: Math.round(heldMs), startDelayMs: Math.round(r.startedAt - pressedAt), recordedMs: Math.round(released - r.startedAt), stoppedEarly,
      timeline: LAB ? timeline : undefined,
    };
    recChunks = [];
    hearing = true;
    holdBtn.disabled = true;
    listenMsg('Working...');
    try {
      if (!capture.bytes) {
        labEntry({ outcome: 'empty', capture });
        releaseMic();
        listenMsg('Nothing was recorded. If headphones just connected, try again.');
        return;
      }
      const pcm = r.graph ? graphPcm : await decode16k(await blob.arrayBuffer());
      const decoded = performance.now();
      capture.peak = 0;
      let sq = 0;
      for (const v of pcm) { const a = Math.abs(v); if (a > capture.peak) capture.peak = a; sq += v * v; }
      capture.rms = Math.sqrt(sq / Math.max(pcm.length, 1));
      capture.peak = +capture.peak.toFixed(4);
      capture.rms = +capture.rms.toFixed(5);
      if (LAB) labLast = pcm;
      if (pcm.length < 16000 * 0.4) {
        labEntry({ outcome: 'too short', seconds: pcm.length / 16000, capture });
        listenMsg('Too short. Hold the button for as long as they speak.');
        return;
      }
      // Below this a recording held no speech; Whisper would invent a word. Real-world silent
      // attempts peaked at 0.004 or less, quiet speech on the phone microphone at 0.007 and up.
      if (capture.peak < 0.005) {
        // Exactly zero is not a quiet room: iOS handed over silence (seen after playback).
        const zeros = capture.peak === 0;
        labEntry({ outcome: zeros ? 'zeros' : 'silent', seconds: pcm.length / 16000, capture });
        releaseMic();
        listenMsg(zeros
          ? 'The phone gave the microphone no sound, which can happen just after audio played. Try again.'
          : 'The microphone recorded silence. Try again; if it keeps happening, close Listen and reopen it.');
        return;
      }
      // Whisper's input features depend on level, and the phone microphone records quietly, so
      // the recording is brought up to a peak of 0.5, with the boost capped at 40 times.
      const boost = Math.min(40, 0.5 / capture.peak);
      capture.gain = boost > 1.2 ? +boost.toFixed(1) : 1;
      if (capture.gain > 1) for (let i = 0; i < pcm.length; i++) pcm[i] *= capture.gain;
      const out = await asr(pcm, { language: lang.split('-')[0].toLowerCase(), task: 'transcribe', max_new_tokens: 64 });
      const transcript = (out.text || '').trim();
      const { match, phrase, ranked } = matchReply(transcript);
      const done = performance.now();
      const entry = labEntry({
        outcome: match ? 'reply' : phrase ? 'own phrase' : 'not sure', seconds: pcm.length / 16000,
        decodeMs: decoded - released, transcribeMs: done - decoded, totalMs: done - released,
        transcript, shown: match ? match.reply.text : phrase ? phrase.text : null, score: ranked[0] ? ranked[0].score : null, capture,
        top: ranked.slice(0, 3).map(c => ({ text: c.mine ? c.text : c.reply.text, mine: !!c.mine, score: +c.score.toFixed(3) })),
      });
      showHeard(transcript, match || phrase, entry);
      listenMsg(stoppedEarly ? 'The microphone changed during that recording (headphones?), so it may be cut short. Try again if the answer looks wrong.' : '');
    } catch (err) {
      labEntry({ outcome: 'error', stage: 'process', error: String(err && err.message || err), capture });
      releaseMic();
      listenMsg(`Could not process that (${err.message || err}). Try again.`);
    } finally {
      hearing = false;
      holdBtn.disabled = false;
    }
  }

  // Newest result on top; the last three are kept so a quick exchange can be read back.
  function showHeard(transcript, m, entry) {
    const box = el('div', 'heard');
    if (m && m.mine) {
      const row = el('div', 'row');
      const t = el('div', 'txt');
      t.append(el('p', 'heard-en', m.en));
      const native = el('p', 'text', m.text);
      native.lang = lang;
      t.append(native);
      t.append(el('p', 'en', 'One of your phrases'));
      row.append(t, controls(m.item));
      box.append(row);
    } else if (m) {
      const row = el('div', 'row');
      const t = el('div', 'txt');
      t.append(el('p', 'heard-en', m.reply.en));
      const native = el('p', 'text', m.reply.text);
      native.lang = lang;
      t.append(native);
      if (m.reply.rom) t.append(el('p', 'rom', m.reply.rom));
      t.append(el('p', 'en', `A reply to: ${form(m.phrase).en}`));
      row.append(t, controls(m.reply));
      box.append(row);
    } else {
      box.append(el('p', 'heard-en', 'Not sure'));
      box.append(el('p', 'en', transcript ? `Heard: ${transcript}` : 'Nothing was heard.'));
    }
    if (entry) box.append(labTruth(entry, m));
    const out = document.getElementById('listen-out');
    out.prepend(box);
    while (out.children.length > 3) out.lastChild.remove();
  }

  // Lab log: one entry per attempt, kept in localStorage and exported as JSON. Transcripts only,
  // never audio. "truth" is what the tester says was actually said, set from each result.
  let labLog = [], labLast = null;
  try { if (LAB) labLog = JSON.parse(localStorage.getItem(LAB_KEY)) || []; } catch {}
  function labSave() {
    try { localStorage.setItem(LAB_KEY, JSON.stringify(labLog)); } catch {}
    labRender();
  }
  function labEntry(fields) {
    if (!LAB) return null;
    const track = mic && mic.getAudioTracks()[0];
    const entry = {
      at: new Date().toISOString(), lang, model: labModel, cutoff: MATCH_MIN, voiceProcessing: labVoice, input: labPhoneMic ? 'phone' : 'system', captureMode: labCapture, mic: track ? track.label : null,
      homeScreen: !!(navigator.standalone || matchMedia('(display-mode: standalone)').matches),
      ...fields, truth: null,
    };
    for (const k of ['seconds', 'decodeMs', 'transcribeMs', 'totalMs', 'score']) if (typeof entry[k] === 'number') entry[k] = +entry[k].toFixed(k === 'score' || k === 'seconds' ? 3 : 0);
    labLog.push(entry);
    labSave();
    return entry;
  }

  function labTruth(entry, m) {
    const box = el('div', 'lab-truth');
    const sel = el('select');
    sel.append(new Option('They actually said...', ''));
    const seen = new Set();
    for (const c of matchers) if (!c.mine && !seen.has(c.reply.text)) { seen.add(c.reply.text); sel.append(new Option(`${c.reply.text} (${c.reply.en})`, c.reply.text)); }
    sel.append(new Option('One of my own phrases', 'mine'), new Option('Something not in the app', 'other'), new Option('Nothing / noise', 'nothing'));
    const set = v => { entry.truth = v || null; sel.value = v; box.classList.toggle('done', !!v); labSave(); };
    sel.onchange = () => set(sel.value);
    if (m) {
      const right = el('button', null, 'Right');
      right.onclick = () => set(m.mine ? 'mine' : m.reply.text);
      box.append(right);
    }
    box.append(sel);
    const note = el('button', null, 'Note');
    note.onclick = () => { const n = prompt('Note for this attempt (accent, noise, distance...)', entry.note || ''); if (n != null) { entry.note = n; labSave(); } };
    box.append(note);
    return box;
  }

  function labRender() {
    if (!LAB) return;
    const bar = document.getElementById('lab-bar');
    bar.hidden = false;
    bar.replaceChildren();
    const marked = labLog.filter(e => e.truth).length;
    bar.append(el('span', null, `Lab log: ${labLog.length} attempts, ${marked} marked.`));
    const copy = el('button', null, 'Copy');
    copy.onclick = async () => {
      const text = JSON.stringify({ app: 'mimik-lab-listen', exported: new Date().toISOString(), ua: navigator.userAgent, entries: labLog }, null, 1);
      try { await navigator.clipboard.writeText(text); copy.textContent = 'Copied'; } catch { prompt('Copy this:', text); }
      setTimeout(() => { copy.textContent = 'Copy'; }, 1500);
    };
    const share = el('button', null, 'Share');
    share.onclick = () => {
      const text = JSON.stringify({ app: 'mimik-lab-listen', exported: new Date().toISOString(), ua: navigator.userAgent, entries: labLog }, null, 1);
      const file = new File([text], 'mimik-lab-listen.json', { type: 'application/json' });
      if (navigator.canShare && navigator.canShare({ files: [file] })) navigator.share({ files: [file] }).catch(() => {});
      else if (navigator.share) navigator.share({ text }).catch(() => {});
    };
    const clear = el('button', null, 'Clear');
    clear.onclick = () => { if (confirm('Delete the lab log on this phone?')) { labLog = []; labSave(); } };
    const model = el('select');
    for (const k of Object.keys(ASR_MODELS)) model.append(new Option(`whisper-${k}`, k));
    model.value = labModel;
    // WebAssembly memory is not given back, so a model switch needs a fresh page.
    model.onchange = () => { try { localStorage.setItem('lab-model', model.value); } catch {} location.reload(); };
    // Plays the last recording from memory, to hear whether the microphone caught the speech.
    const hear = el('button', null, 'Play last recording');
    hear.onclick = () => {
      if (!labLast) return;
      const ctx = new AudioContext();
      const buf = ctx.createBuffer(1, labLast.length, 16000);
      buf.copyToChannel(labLast, 0);
      const src = ctx.createBufferSource();
      src.buffer = buf;
      src.connect(ctx.destination);
      src.onended = () => ctx.close();
      src.start();
    };
    const voice = el('select');
    voice.append(new Option('Mic: raw', '0'), new Option('Mic: voice processing', '1'));
    voice.value = labVoice ? '1' : '0';
    voice.onchange = () => { try { localStorage.setItem('lab-voice', voice.value); } catch {} location.reload(); };
    const input = el('select');
    input.append(new Option('Input: phone microphone', 'phone'), new Option('Input: system choice', 'system'));
    input.value = labPhoneMic ? 'phone' : 'system';
    input.onchange = () => { try { localStorage.setItem('lab-input', input.value); } catch {} location.reload(); };
    const cap = el('select');
    cap.append(new Option('Capture: recorder', 'recorder'), new Option('Capture: Web Audio', 'webaudio'));
    cap.value = labCapture;
    cap.onchange = () => { try { localStorage.setItem('lab-capture', cap.value); } catch {} location.reload(); };
    bar.append(copy, share, clear, hear, model, voice, input, cap);
  }

  async function init() {
    data = await (await fetch('phrases.json')).json();
    try {
      const h = await (await fetch('human.json')).json();
      for (const g of ['m', 'f']) human[g] = new Set(h[g] || []);
    } catch {}
    lang = data.lang;
    timed = data.sections.filter(s => s.hours);
    document.getElementById('lang').textContent = data.native;
    // The root picker forwards here on the next launch.
    try { localStorage.setItem('lang', location.pathname.split('/').filter(Boolean).pop()); } catch {}
    for (const b of document.querySelectorAll('.who button')) b.onclick = () => setGender(b.dataset.g);
    document.getElementById('find').onclick = () => document.getElementById('search').hidden ? openSearch() : closeSearch();
    document.getElementById('search-close').onclick = closeSearch;
    const q = document.getElementById('q');
    q.oninput = () => { query = q.value; render(); window.scrollTo(0, 0); };
    q.onkeydown = e => { if (e.key === 'Escape') closeSearch(); else if (e.key === 'Enter') q.blur(); };
    setupMedia();
    if ('MediaRecorder' in window && navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
      const fab = document.getElementById('listen-fab');
      fab.hidden = false;
      fab.onclick = openListen;
      document.getElementById('listen-close').onclick = closeListen;
      getBtn.onclick = prepareListening;
      holdBtn.addEventListener('pointerdown', startHearing);
      holdBtn.addEventListener('pointerup', stopHearing);
      holdBtn.addEventListener('pointercancel', stopHearing);
      holdBtn.addEventListener('touchstart', e => e.preventDefault(), { passive: false });
      holdBtn.addEventListener('touchend', stopHearing);
      holdBtn.addEventListener('touchcancel', stopHearing);
      holdBtn.addEventListener('contextmenu', e => e.preventDefault());
      document.addEventListener('keydown', e => { if (e.key === 'Escape' && document.getElementById('show').hidden) closeListen(); });
      // Headphones connecting or disconnecting change the input: the open microphone is dropped so
      // the next press opens the new one, unless a recording is under way.
      navigator.mediaDevices.addEventListener('devicechange', async () => {
        if (LAB) {
          let inputs = [];
          try { inputs = (await navigator.mediaDevices.enumerateDevices()).filter(d => d.kind === 'audioinput').map(d => d.label); } catch {}
          labEntry({ outcome: 'device change', inputs, track: micState() });
        }
        if (recorder) return;
        releaseMic();
        // Reopen now, so the next press does not wait for the new route.
        if (!listenEl.hidden && asr) {
          try { mic = await openMic(); } catch {}
          showReady();
        }
      });
      // The microphone is released whenever the app goes to the background.
      document.addEventListener('visibilitychange', () => { if (document.hidden) closeListen(); });
    }
    setGender(gender);
    tick();
    setInterval(tick, 20000);
    document.addEventListener('visibilitychange', () => { if (!document.hidden) tick(); });
    window.addEventListener('online', checkOffline);
    if ('speechSynthesis' in window) speechSynthesis.getVoices();
  }

  if (!LAB && 'serviceWorker' in navigator) {
    regReady = navigator.serviceWorker.register('sw.js');
    // Reload once when an updated worker takes over, but not on the very first install,
    // including when the root worker controlled this page before ours claimed it.
    const ctl = navigator.serviceWorker.controller;
    let reloaded = !ctl || ctl.scriptURL !== new URL('sw.js', location).href;
    navigator.serviceWorker.addEventListener('controllerchange', () => {
      if (reloaded) return;
      reloaded = true;
      location.reload();
    });
  }

  init();
})();
</script>
</body>
</html>
